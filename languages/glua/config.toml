name = "GLua"
grammar = "lua"
path_suffixes = ["lua"]
line_comments = ["-- ", "--- "]
block_comment = ["--[", "]"]
autoclose_before = ";:.,=}])>"
first_line_pattern = "^#!.*\\b(gmod|glua)\\b"
tab_size = 4
collapsed_placeholder = "--[ ... ]--"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
    { start = "[=", end = "=]", close = true, newline = false },
    { start = "[[", end = "]]", close = true, newline = false },
    { start = "then", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "do", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "function", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "repeat", end = "until", close = false, newline = true, not_in = ["comment", "string"] },
]

increase_indent_pattern = "^\\s*(if|elseif|else|do|while|for|repeat|((local|global)\\s+)?function|.+=\\s*function|.*[,(]\\s*function)\\b"
decrease_indent_pattern = "^\\s*(elseif|else|end|until)\\b"
